name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'packages/after/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build after package
        run: |
          cd packages/after
          pnpm run build
        env:
          NODE_ENV: production

      - name: Build Storybook
        run: |
          cd packages/after
          STORYBOOK_BASE_PATH=/storybook/ pnpm run build-storybook

      - name: Prepare deployment
        run: |
          mkdir -p deploy
          cp -r packages/after/dist/* deploy/
          mkdir -p deploy/storybook
          cp -r packages/after/storybook-static/* deploy/storybook/

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./deploy

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
